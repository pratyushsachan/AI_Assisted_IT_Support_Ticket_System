# --- Server ---
server.port=8080

# --- Database (H2 in-memory for local dev — zero setup required) ---
# Swap these 4 lines for Postgres before deploying (see README)
spring.datasource.url=jdbc:h2:mem:ticketdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- H2 web console (visit http://localhost:8080/h2-console while app is running) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- AI: Groq API (Phase 4) ---
# The key is read from an environment variable — NEVER hardcode it here,
# since this file gets committed to GitHub. See README for how to set it.
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=llama-3.1-8b-instant
